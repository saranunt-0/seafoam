<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seafoam Proof of Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: a full-bleed 3D sea, with small glass panels pinned to the corners. */
  :root {
    color-scheme: dark;
    --ink: #e9f6f6;
    --ink-muted: #a9c6cc;
    --glass: rgba(5, 30, 42, 0.58);
    --glass-strong: rgba(4, 22, 32, 0.82);
    --line: rgba(190, 240, 232, 0.22);
    --foam: #a6f2e2;
    --deep: #06202d;
    --font-display: "Young Serif", Georgia, "Times New Roman", serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--deep);
    color: var(--ink);
    font: 14px/1.45 var(--font-body);
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .intro {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(330px, calc(100vw - 32px));
    padding: 12px 14px;
    display: grid;
    gap: 4px;
  }
  .intro h1 {
    margin: 0;
    font: 400 26px/1.05 var(--font-display);
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .intro h1 span { color: var(--foam); }
  .intro p { margin: 0; color: var(--ink-muted); font-size: 13px; }
  .intro .hint { font-size: 12px; }

  .presets {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 4px;
    padding: 4px;
  }
  .presets button {
    font: 600 13px/1 var(--font-body);
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 7px;
    padding: 9px 14px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .presets button:hover { background: rgba(255, 255, 255, 0.08); }
  .presets button[aria-pressed="true"] { background: var(--foam); color: var(--deep); }
  .presets button:focus-visible { outline: 2px solid var(--foam); outline-offset: 2px; }

  #stats {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    padding: 6px 10px;
    font: 11px/1.3 var(--font-mono);
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    max-width: calc(100vw - 32px);
  }
  #stats:empty { display: none; }

  #gui {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    max-height: calc(100% - 100px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  #gui .lil-gui {
    --background-color: var(--glass-strong);
    --widget-color: rgba(255, 255, 255, 0.1);
    --hover-color: rgba(255, 255, 255, 0.16);
    --focus-color: rgba(255, 255, 255, 0.22);
    --number-color: var(--foam);
    --string-color: var(--foam);
    --text-color: var(--ink);
    --title-background-color: rgba(4, 22, 32, 0.95);
    --font-family: var(--font-body);
    --width: 280px;
    border-radius: 10px;
  }

  #error {
    position: fixed;
    inset: auto max(16px, env(safe-area-inset-right, 0px)) calc(70px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    padding: 12px 14px;
    background: #3a1214;
    color: #ffd9d6;
    border-radius: 10px;
    font: 12px/1.4 var(--font-mono);
    white-space: pre-wrap;
  }

  @media (max-width: 700px) {
    .intro { padding: 10px 12px; }
    .intro h1 { font-size: 21px; }
    .intro .hint { display: none; }
    #stats { bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
    #gui { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); max-height: 55%; }
    #gui .lil-gui { --width: 250px; }
  }
</style>
</head>
<body>
<div id="scene" aria-label="Animated 3D ocean with stylized foam"></div>

<header class="intro panel">
  <h1>Sea<span>foam</span></h1>
  <p>Stylized foam on an FFT ocean. One foam rule drives the whitecaps, wake, contact foam and spray.</p>
  <p class="hint">Drag to orbit, scroll to zoom. Switch foam sources on and off under Foam layers.</p>
</header>

<div id="gui"></div>
<div id="stats" class="panel" aria-live="off"></div>

<nav class="presets panel" aria-label="Sea state">
  <button type="button" id="preset-calm" data-preset="calm" aria-pressed="false">Calm</button>
  <button type="button" id="preset-normal" data-preset="normal" aria-pressed="true">Normal</button>
  <button type="button" id="preset-stormy" data-preset="stormy" aria-pressed="false">Stormy</button>
</nav>

<div id="error" hidden></div>

<script>
  // Show load and WebGL errors on the page instead of a silent blank sea.
  window.addEventListener('error', (event) => {
    const box = document.getElementById('error');
    box.hidden = false;
    box.textContent = 'Something went wrong while starting the demo:\n' + (event.message || event.error);
  });
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
